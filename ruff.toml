# Ruff config for the whole repo (backend/ and tools/). Pinned ruff version: backend/requirements-dev.txt.
target-version = "py311"
line-length = 110
extend-exclude = ["handoff", ".venv"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "DJ"]
# RUF012 flags Django `class Meta` lists (constraints/indexes) - a framework idiom, not shared mutable state.
ignore = ["RUF012"]

[lint.per-file-ignores]
# Django-generated migrations: long lines are the generator's style.
"backend/*/migrations/*.py" = ["E501"]

[lint.isort]
known-first-party = ["aleekhan", "platform_core"]
