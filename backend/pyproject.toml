[project]
name = "aleekhan-backend"
version = "0.0.0"
description = "Aleekhan factory platform backend (Django modular monolith, DEC-001)"
requires-python = ">=3.12"  # ADR-001: Python 3.12+ (REV-0005)

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["platform_core.tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["dj_database_url"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "aleekhan.settings_test"  # explicit test env (REV-0011)

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "aleekhan.settings_test"  # explicit test env (REV-0011)
testpaths = ["platform_core/tests"]
# perf smoke (00.7) is deselected by default; run it explicitly with `pytest -m perf` (a later -m wins).
addopts = "-ra --strict-markers -m \"not perf\""
markers = ["perf: latency smoke on synthetic data (00.7); TECHNICAL DEFAULT budget, run with -m perf"]
