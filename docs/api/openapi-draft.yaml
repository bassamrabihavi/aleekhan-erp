        - APPROVED
        - REJECTED
        - WITHDRAWN
        - EXPIRED
        - SUPERSEDED
    AuditActorFilter:
      name: actor_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    AuditResourceTypeFilter:
      name: resource_type
      in: query
      required: false
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_.]{0,63}$
    AuditResourceIdFilter:
      name: resource_id
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 64
    AuditActionFilter:
      name: action
      in: query
      required: false
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){1,4}$
        maxLength: 120
    OccurredFromFilter:
      name: occurred_from
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/UtcTimestamp'
    OccurredToFilter:
      name: occurred_to
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/UtcTimestamp'
    JobStateFilter:
      name: state
