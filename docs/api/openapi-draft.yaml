components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: aleekhan_session
      description: |
        PHASE_01 (implemented in 01.4): server-side session (HttpOnly, Secure outside dev/test, SameSite=Lax) issued after
        local username/password (+ MFA per DEC-003/DEC-042). Unsafe methods additionally require the
        `X-CSRFToken` header (cookie `csrftoken` from getLoginContext). No AD/LDAP/SSO (DEC-003).
        0.5.0 (01.1): the session id is rotated at login and at MFA verification; a session in state
        MFA_PENDING is accepted only by `verifyMfa` and `logout`. Idle/absolute timeout (DEC-051): users 2 h / 12 h, operators idle 8 h internal only; max 3 concurrent sessions. Browser
        only (DEC-002): no bearer/API tokens in PHASE_01 (CONFLICTS C-35).
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Client correlation id; server generates one when absent or malformed.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on every mutating request (none exist in PHASE_00). Stored with request hash and response.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the version being modified (optimistic concurrency). Missing -> 428, stale -> 412.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `next_cursor`.
      schema:
        type: string
        maxLength: 512
    ConflictId:
      name: conflict_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{16,64}$
      description: Opaque public handle of a session (never the session secret).
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: role_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UnitId:
      name: unit_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PositionId:
      name: position_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PositionAssignmentId:
      name: position_assignment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DefinitionId:
      name: definition_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InstanceId:
      name: instance_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditEventId:
      name: audit_event_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionId:
      name: revision_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ValueRevisionId:
      name: value_revision_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ParameterKey:
      name: parameter_key
      in: path
