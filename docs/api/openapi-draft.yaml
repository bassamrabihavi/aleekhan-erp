      description: |
        Requires permission `platform.workflow.approval.decide` (deny by default; record scope enforced server-side).
        MFA step-up: a session whose last MFA verification is older than the step-up window gets 401 MFA_REQUIRED (window: parameter `mfa_step_up_window_minutes` = 15 min, DEC-051; also inside the factory network, DEC-049).
        Decided: DEC-032 APPROVED 2026-11-04 (no longer blocked; schema in 01.2, rule implemented in 01.3/01.4).
        maker == checker -> 403 SELF_APPROVAL_FORBIDDEN. The resource revision in the request must equal the revision the request was raised for (else 409). Technical admin rights never satisfy this permission (DEC-003). Maker-checker applies to document revision approval, BUSINESS_RULE parameter publish and assignment of roles holding business-approval permissions (DEC-032); requests expire after 30 days; routing in PHASE_01 = role + unit scope only (DEC-048); deciders per the approved matrix (DEC-049).
      x-aleekhan-permission: platform.workflow.approval.decide
      x-aleekhan-mfa-step-up: true
      x-aleekhan-decided-by:
      - DEC-032
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
