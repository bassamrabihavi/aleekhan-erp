              type: integer
              minimum: 0
            oldest_pending_at:
              oneOf:
              - $ref: '#/components/schemas/UtcTimestamp'
              - type: 'null'
        jobs:
          type: object
          additionalProperties: false
          required:
          - running
          - queued
          - failed_24h
          properties:
            running:
              type: integer
              minimum: 0
            queued:
              type: integer
              minimum: 0
            failed_24h:
              type: integer
              minimum: 0
            housekeeping_alerts:
              description: 0.6.3-draft (01.7). Number of housekeeping job types that are overdue or failing.
              type: integer
              minimum: 0
            housekeeping:
              description: |
                0.6.3-draft (01.7). One entry per housekeeping job type (seeded job definitions). `overdue` = no
                SUCCEEDED run finished within `max_age_seconds` (TECHNICAL DEFAULT; there is no scheduler in
                PHASE_01, so a never-run job is overdue); `failing` = the newest finished run is FAILED. Machine
                error codes only, never exception text.
              type: array
              maxItems: 32
              items:
                $ref: '#/components/schemas/HousekeepingJobHealth'
        integration:
          description: |
            0.6.2-draft (01.6). Event delivery freshness: `lag_seconds` = age of the oldest event not yet delivered
            (PENDING / FAILED / DISPATCHED; null when none); `stale` = lag > `stale_after_seconds` (TECHNICAL
            DEFAULT 900 s); `blocked_aggregates` = aggregates whose events wait behind a DEAD_LETTER event
            (per-aggregate ordering), `held_events` = undelivered events behind such a head; `compensation_open` =
            compensation records with outcome MANUAL_REQUIRED or HOOK_FAILED. Counts only.
          type: object
          additionalProperties: false
          required:
          - lag_seconds
          - stale
          - stale_after_seconds
          - blocked_aggregates
          - held_events
          - open_conflicts
          - compensation_open
          - last_acked_at
          properties:
            lag_seconds:
              oneOf:
              - type: integer
                minimum: 0
              - type: 'null'
            stale:
              type: boolean
            stale_after_seconds:
              type: integer
              minimum: 1
            blocked_aggregates:
              type: integer
              minimum: 0
            held_events:
              type: integer
              minimum: 0
            open_conflicts:
              type: integer
              minimum: 0
            compensation_open:
              type: integer
              minimum: 0
            last_acked_at:
              oneOf:
              - $ref: '#/components/schemas/UtcTimestamp'
              - type: 'null'
        security:
          type: object
          additionalProperties: false
          required:
          - failed_logins_24h
          - locked_users
          properties:
            failed_logins_24h:
              type: integer
              minimum: 0
            locked_users:
              type: integer
              minimum: 0
    HousekeepingJobHealth:
      type: object
      additionalProperties: false
      required:
      - job_type
      - last_state
      - last_succeeded_at
      - last_failed_at
