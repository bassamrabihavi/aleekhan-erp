  headers:
    X-Request-ID:
      description: Correlation id of this request (echoed or generated).
      schema:
        type: string
        format: uuid
    ETag:
      description: Strong entity tag of the returned representation/version.
      schema:
        type: string
    Retry-After:
      description: Seconds before retrying.
      schema:
        type: integer
        minimum: 1
    Cache-Control:
      description: Cache directive (`no-cache` = revalidate with the ETag).
      schema:
        type: string
        enum: [no-cache, no-store]
    Idempotent-Replayed:
      description: '`true` when the response is the stored response of an earlier request with the same key.'
      schema:
        type: string
        const: 'true'
    Cache-Control-NoStore:
      description: Always `no-store` for health/access responses.
      schema:
        type: string
        const: no-store
  responses:
    ValidationFailed:
      description: Request parameters invalid
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.aleekhan.invalid/VALIDATION_FAILED
            title: Validation failed
            status: 400
            code: VALIDATION_FAILED
            message_fa: مقدار ورودی معتبر نیست.
            request_id: 3f1c2a9e-6b1d-4c8e-9a51-0d2f6f0b7c11
            errors:
              - field: action
                code: PATTERN_MISMATCH
    AuthenticationRequired:
      description: No authenticated principal
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        WWW-Authenticate:
          description: |
            REV-0013 (carried from PHASE_00, implemented in 01.4): RFC 9110 requires this header on 401. Planned
            value `Session realm="aleekhan"` (cookie session; no Basic/Bearer challenge so browsers never show a
            native login dialog). Not sent by PHASE_00 code.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.aleekhan.invalid/AUTHENTICATION_REQUIRED
            title: Authentication required
            status: 401
            code: AUTHENTICATION_REQUIRED
            message_fa: برای این کار باید وارد سامانه شوید.
            request_id: 3f1c2a9e-6b1d-4c8e-9a51-0d2f6f0b7c11
    AccessDenied:
      description: Authenticated but the action is not permitted
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Missing, or outside the caller's scope (BOLA/IDOR)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: STATE_TRANSITION_NOT_ALLOWED, RULE_NOT_APPROVED, IDEMPOTENCY_IN_PROGRESS, SOURCE_READ_ONLY or SOURCE_DISABLED
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    VersionConflict:
      description: If-Match is stale or weak
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match or Idempotency-Key missing
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyKeyReused:
      description: Same Idempotency-Key used for a different request
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Too many requests
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    LoginFailed:
      description: 'INVALID_CREDENTIALS: same answer for unknown user, wrong password, disabled or locked account,
        expired one-time password and a wrong MFA code'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: FILE_TYPE_NOT_ALLOWED (allowlist + magic bytes + no macros, DEC-053 APPROVED)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ComponentStatus:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          enum: [database, migrations, cache, object_storage, worker]
        status:
          type: string
          enum: [up, down, unknown]
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checked_at, components]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checked_at:
          $ref: '#/components/schemas/UtcTimestamp'
        components:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/ComponentStatus'
    VersionInfo:
      type: object
      additionalProperties: false
      required: [api_version, contract_version, build_commit, environment]
      properties:
        api_version:
          type: string
          const: v1
        contract_version:
          type: string
          description: SemVer of the OpenAPI document.
        build_commit:
          type: string
          pattern: '^[0-9a-f]{7,40}$'
        environment:
          type: string
          enum: [dev, test, staging, production]
    AccessDecision:
      type: object
      additionalProperties: false
      required: [decision, reason_code, action, request_id]
      properties:
        decision:
          type: string
          enum: [ALLOW, DENY]
          description: Always DENY in PHASE_00.
        reason_code:
          type: string
          enum: [POLICY_NOT_DEFINED, ROLE_MISSING, SCOPE_MISMATCH, MFA_STEP_UP_REQUIRED, SELF_APPROVAL_FORBIDDEN, RULE_NOT_APPROVED]
        action:
          type: string
        decision_id:
          type: [string, 'null']
          pattern: '^DEC-[0-9]{3}$'
          description: Blocking decision when reason_code is RULE_NOT_APPROVED.
        request_id:
          type: string
          format: uuid
    Problem:
      type: object
      description: RFC 9457 problem details + Aleekhan stable fields. Never contains stack traces, SQL, secrets or PII.
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ErrorCode'
        message_fa:
          type: string
          description: Human Persian message (may change; clients must branch on `code`).
        detail:
          type: string
        request_id:
          type: string
          format: uuid
        decision_id:
          type: string
          pattern: '^DEC-[0-9]{3}$'
          description: Present with RULE_NOT_APPROVED.
        errors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string
              message_fa:
                type: string
    ErrorCode:
      type: string
      description: Stable machine error codes (HTTP mapping in x-aleekhan-conventions.error_codes).
      enum:
        - VALIDATION_FAILED
        - AUTHENTICATION_REQUIRED
        - MFA_REQUIRED
        - ACCESS_DENIED
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - PRECONDITION_REQUIRED
        - VERSION_CONFLICT
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - RULE_NOT_APPROVED
        - STATE_TRANSITION_NOT_ALLOWED
        - SOURCE_READ_ONLY
        - SOURCE_DISABLED
        - INVALID_CREDENTIALS
        - NETWORK_POLICY_DENIED
        - PASSWORD_CHANGE_REQUIRED
        - SELF_APPROVAL_FORBIDDEN
        - PASSWORD_POLICY_VIOLATION
        - FILE_TYPE_NOT_ALLOWED
        - FILE_NOT_RELEASED
        - JOB_PROTECTED
        - RATE_LIMITED
        - PAYLOAD_TOO_LARGE
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
    UtcTimestamp:
      type: string
      format: date-time
      pattern: 'Z$'
      description: RFC 3339 UTC timestamp.
    Code14:
      type: string
      pattern: '^[0-9]{14}$'
      minLength: 14
      maxLength: 14
      description: 14-digit Rahkaran code as STRING (leading zeros preserved). Must be paired with a namespace.
    CodeNamespace:
      type: string
      enum: [product_code, die_code]
      description: Namespaces are independent; no shared sequence (DOMAIN_ENTITY_CATALOG.md). Cliche codes are alphanumeric and NOT Code14.
    SourceCode:
      type: string
      pattern: '^[a-z][a-z0-9_]{2,63}$'
    SourceFreshness:
      type: object
      additionalProperties: false
      required: [source_code, name_fa, kind, direction, is_enabled, freshness, last_success_at, last_as_of,
                 staleness_threshold_seconds, threshold_basis, policy_decision_id]
      properties:
        source_code:
          $ref: '#/components/schemas/SourceCode'
        name_fa:
          type: string
        kind:
          type: string
          enum: [EXCEL_FILE, XLSM_FILE]
        direction:
          type: string
          const: READ_ONLY
          description: Every PHASE_00 source is read-only (DB CHECK); write-back needs its own ADR.
        is_enabled:
          type: boolean
        freshness:
          type: string
          enum: [fresh, stale, never]
        last_success_at:
          oneOf:
            - $ref: '#/components/schemas/UtcTimestamp'
            - type: 'null'
        last_as_of:
          oneOf:
            - $ref: '#/components/schemas/UtcTimestamp'
            - type: 'null'
        staleness_threshold_seconds:
          type: integer
          minimum: 1
        threshold_basis:
          type: string
          enum: [TECHNICAL_DEFAULT, OWNER_APPROVED]
        policy_decision_id:
          type: string
          pattern: '^DEC-[0-9]{3}$'
    FreshnessPage:
      type: object
      additionalProperties: false
      required: [items, page, checked_at]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SourceFreshness'
        page:
          $ref: '#/components/schemas/PageMeta'
        checked_at:
          $ref: '#/components/schemas/UtcTimestamp'
    ConflictStatus:
      type: string
      enum: [OPEN, RESOLVED, DISMISSED]
    ConflictItem:
      type: object
      additionalProperties: false
      required: [conflict_id, source_code, batch_id, kind, conflict_key, details, status, raised_at, resolved_at,
                 resolution_note, row_version]
      properties:
        conflict_id:
          type: string
          format: uuid
        source_code:
          $ref: '#/components/schemas/SourceCode'
        batch_id:
          type: [string, 'null']
          format: uuid
        kind:
          type: string
          pattern: '^[a-z][a-z0-9_]{2,63}$'
        conflict_key:
          type: string
          minLength: 1
          maxLength: 200
        details:
          type: object
          description: Redacted; identifiers only (no personal data, secrets or salary).
        status:
          $ref: '#/components/schemas/ConflictStatus'
        raised_at:
          $ref: '#/components/schemas/UtcTimestamp'
        resolved_at:
          oneOf:
            - $ref: '#/components/schemas/UtcTimestamp'
            - type: 'null'
        resolution_note:
          type: [string, 'null']
          maxLength: 500
        row_version:
          type: integer
          minimum: 1
    ConflictPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ConflictItem'
        page:
          $ref: '#/components/schemas/PageMeta'
    ConflictResolveRequest:
      type: object
      additionalProperties: false
      required: [outcome, note]
      properties:
        outcome:
          type: string
          enum: [RESOLVED, DISMISSED]
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: Short justification without personal data (stored with the item and in the audit trail).
    PageMeta:
      type: object
      additionalProperties: false
      required: [page_size, next_cursor]
      properties:
        page_size:
          type: integer
        next_cursor:
          type: [string, 'null']
    SystemKey:
      type: string
      pattern: ^[a-z][a-z0-9_]{2,63}$
      description: Immutable technical key (never renamed; labels are separate).
    EntityRef:
      type: object
      additionalProperties: false
      required:
      - entity_type
      - entity_id
      properties:
        entity_type:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        entity_id:
          type: string
          minLength: 1
          maxLength: 64
        revision:
          type:
          - integer
          - 'null'
          minimum: 1
    Scope:
      type: object
      additionalProperties: false
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - GLOBAL
          - ORG_UNIT
          - ORG_UNIT_SUBTREE
          - SITE
          - WAREHOUSE
          - LINE
          - CUSTOMER
          description: Record scope of an assignment. PHASE_01 implements GLOBAL, ORG_UNIT and ORG_UNIT_SUBTREE; the others
            are reserved for their owning phases.
        ref_id:
          type:
          - string
          - 'null'
          format: uuid
    ReasonRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Mandatory justification, stored in the audit trail; no personal data.
    OptionalNoteRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        note:
          type: string
          maxLength: 500
    LoginContext:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          const: ok
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
