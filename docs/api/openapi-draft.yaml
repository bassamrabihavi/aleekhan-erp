      - expires_at
      - mfa_verified_at
      - network_zone
      properties:
        session_handle:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,64}$
        state:
          type: string
          enum:
          - MFA_PENDING
          - ACTIVE
          - EXPIRED
          - REVOKED
          - LOGGED_OUT
        user_id:
          type: string
          format: uuid
        created_at:
          $ref: '#/components/schemas/UtcTimestamp'
        last_seen_at:
          $ref: '#/components/schemas/UtcTimestamp'
        expires_at:
          $ref: '#/components/schemas/UtcTimestamp'
        mfa_verified_at:
          oneOf:
          - $ref: '#/components/schemas/UtcTimestamp'
          - type: 'null'
        network_zone:
          type: string
          enum:
          - INTERNAL
          - EXTERNAL
          - UNKNOWN
          description: From the trusted proxy's client address; zone from the server-side CIDR list (DEC-052).
        is_current:
          type: boolean
        password_change_required:
          type: boolean
          description: Login/verify only - the one-time or expired password must be changed first (DEC-051).
        mfa_enrolment_required:
          type: boolean
          description: Login only - MFA applies but no factor is enrolled yet (inside the factory network, E-2).
