openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Aleekhan Factory Platform API
  version: 0.7.0-draft
  summary: PHASE_00 + PHASE_01 platform contract (implemented) + PHASE_02 identity/commercial operations (PLANNED, 02.1).
  description: |
    Status: DRAFT (PHASE_00 / 00.1 Discovery & Contract, implemented in 00.4). Not approved. This hand-written
    document is the contract (contract-first): the backend is tested against it (route parity, security
    declarations and response-schema validation of every phase-0 endpoint in
    backend/platform_core/tests/test_api_contract.py). Runtime details: docs/api/API_RUNTIME.md.

    0.5.0-draft (PHASE_01 / 01.1 Discovery & Contract): adds PLANNED operations for login/session/logout, me,
    users/roles/assignments, org tree, tasks/approvals/workflow, audit query, jobs/health detail, documents
    (quarantined upload, SEC-03) and parameters/dynamic-field drafts. Every planned path item carries
    `x-aleekhan-status: planned` and `x-aleekhan-step` (the step that implements it); planned paths are NOT
    served by the production URLconf (the route-parity contract test compares only implemented paths and the
    planned-contract test pins them). Existing 0.4.0 operations are unchanged (additive change only). Every
    planned operation requires an authenticated session except the two pre-login operations of `/auth/login`
    (CONFLICTS C-26, pinned in the planned-contract test). Operations whose rule is not approved declare
    `x-aleekhan-blocked-by` and answer 409 RULE_NOT_APPROVED until the decision is approved. New error codes
    needed by PHASE_01 are listed in `x-aleekhan-conventions.planned_error_codes` and join `ErrorCode` only in
    the reviewed commit that implements them (docs/engine/ERROR_CODES.md rule 5).

    0.5.1-draft (PHASE_01 / 01.2 Database): the employer APPROVED DEC-032 and DEC-048..DEC-054 on 2026-11-04.
    Operations that were blocked by them now carry `x-aleekhan-decided-by` (traceability) instead of
    `x-aleekhan-blocked-by`; no planned operation is blocked by an open decision any more (the only open PHASE_01
    item, DEC-027, is UI scope). REV-0101: `rejectDocumentRevision` declares the MFA step-up of its permission.
    Enums aligned with the 01.2 schema: `User.account_kind` = PERSON | OPERATOR (personal operator accounts only,
    DEC-052), `PositionAssignment.kind` = PRIMARY | ACTING (DEC-048), `Parameter.classification` adds
    OWNER_POLICY (owner-approved platform/security policy, e.g. DEC-051 values). Implemented paths unchanged.

    0.5.2-draft (PHASE_01 / 01.3 Domain Engine): the planned error codes join `ErrorCode` together with the engine
    (errors.py, golden catalogue, docs/engine/ERROR_CODES.md): INVALID_CREDENTIALS 401, NETWORK_POLICY_DENIED 403,
    SELF_APPROVAL_FORBIDDEN 403, PASSWORD_POLICY_VIOLATION 422, FILE_TYPE_NOT_ALLOWED 415, FILE_NOT_RELEASED 409,
    JOB_PROTECTED 409, plus PASSWORD_CHANGE_REQUIRED 403 (a session whose one-time or expired password must be
    changed first, DEC-051). Additive change; no path, operation or existing code changed.

    0.6.0-draft (PHASE_01 / 01.4 Backend/API): every PHASE_01 operation is IMPLEMENTED (the planned markers
    are removed; route parity now covers all paths). Production authorization = role/scope policy over the
    APPROVED permission matrix v1.0 (DEC-049) with session-cookie authentication; deny by default stays (an
    action outside the catalogue is denied). Additions (backward compatible within v1): `stepUpMfa`
    (POST /auth/mfa/step-up, fresh MFA for x-aleekhan-mfa-step-up operations; authentication ceremony, exempt
    from Idempotency-Key); `bootstrapSelfApproveRequest` (POST /workflow/approvals/{approval_id}/bootstrap-approve,
    DEC-055 option B: the owner approves the FIRST holder of a business-approval role; a separate operation so
    approveRequest keeps DEC-032 unchanged); `createUser` answers `UserCreated` (user + one-time credential
    shown once, never stored in idempotency records - a replay shows `[REDACTED]`); optional
    `RoleAssignmentCreateRequest.confirm_self_assignment` (explicit self-assignment, DEC-003); optional
    `SessionInfo.password_change_required` / `mfa_enrolment_required`, `Approval.bootstrap_self_approval`;
    nullable `User.created_by`, `Task.created_by`, `RoleAssignment.granted_by`,
    `ParameterValueRevision.proposed_by` (NULL = system/console); `Permission.sensitivity` optional/nullable
    (the v1.0 catalogue carries none); `AuditIntegrity.status` adds ERROR (a check that could not complete);
    the audit `resource_type` filter accepts dotted names (`platform.user`). requestJobCancel text aligned with
    STATE_TRANSITIONS 4.7 (QUEUED -> CANCELLED at once).

    0.6.1-draft (PHASE_01 / 01.5 UI): optional `ParameterValueRevision.row_version` (integer >= 1). Without it a
    client could not send the `If-Match` that `publishParameterValue` requires for a value proposed by someone
    else (there is no GET of a single value revision). Additive; no path, operation or existing field changed.
    The authorization policy runs over the APPROVED permission matrix v1.1 (DEC-056: owner_admin reads all
    approval requests and holds platform.workflow.approval.decide; maker != checker unchanged).

    0.6.2-draft (PHASE_01 / 01.6 Integration): optional `HealthDetail.integration` (event delivery lag, stale flag,
    aggregates blocked by a dead letter and events held behind them, open conflicts, compensation records that
    need a human, last acknowledgement) for page 36. Additive; no path, operation or existing field changed.
    There is still no dead-letter replay/discard operation (engine function only; listed as a contract item in
    docs/integration/README.md section 9). Matrix v1.2 (DEC-056 extension, 2026-11-10): owner_admin also holds
    platform.document.approve and platform.config.parameter.publish (BUSINESS_RULE values only); maker != checker
    unchanged. Every outbox event follows the event catalogue (docs/integration/EVENT_CATALOGUE.md).

    0.6.3-draft (PHASE_01 / 01.7 Security & Ops): optional `HealthDetail.jobs.housekeeping` (per housekeeping job
    type: last run state, last success / failure time, `overdue` = no success within `max_age_seconds`
    (TECHNICAL DEFAULT), `failing` = the newest finished run FAILED) and `HealthDetail.jobs.housekeeping_alerts`
    (number of overdue or failing types) for page 36. `HealthDetail.integration.blocked_aggregates` now counts
    only aggregates with events really waiting behind a dead letter (REV-0130; description unchanged). The outbox
    gets the terminal delivery state DISCARDED (owner, server console, audited; REV-0129) - not exposed by any
    operation. Additive; no path, operation or existing field changed. Matrix v1.3 (DEC-056 extension 2,
    2026-11-10): owner_admin also holds platform.document.read and platform.document.download (CLEAN only,
    audited); not business-approval permissions.

    0.7.0-draft (PHASE_02 / 02.1 Discovery & Contract): adds PLANNED operations for the Identity module
    (customers, brands, product classes, products, styles and style revisions, product-code validation and
    registry, code rule revisions, serials and snapshots, external references, historical order records) and
    the Commercial module (customer orders and lines, order versions, change requests): 63 operations on
    48 paths, all `x-aleekhan-status: planned` with `x-aleekhan-step: '02.4'`; none is routed.
    14 operations are blocked by open decisions (`x-aleekhan-blocked-by`: DEC-005 code rules,
    DEC-006 serial format/line relation, DEC-057 PHASE_02 permission matrix, DEC-059 order changes) and answer
    409 RULE_NOT_APPROVED. Permission ids (`identity.*`, `commercial.*`) are proposals: no role holds them
    before DEC-057. 14-digit codes stay `Code14` strings with a namespace; `SerialNumber` has NO pattern until
    DEC-006. Two side-effect free POSTs (`side_effect_free_operations`) carry no Idempotency-Key. Planned error
    codes are listed in `planned_error_codes`. Existing PHASE_00/PHASE_01 paths, operations and components are
    unchanged (additive change only). Sources: docs/discovery/CONFLICTS.md C-47..C-76, DATA_TABLE.md and
    STATE_TRANSITIONS.md section 5 (PHASE_02).

    Stack: Django 5.2 LTS + DRF (DEC-001). Base path is versioned: every endpoint lives under `/api/v1`.
    A breaking change requires `/api/v2` (or an explicitly approved deprecation window); additive changes only
    within v1. Security is declared top-level (`sessionCookie`, deny by default); only the platform probes
    override it with `security: []` (REV-0001).

    Scope of this draft (PHASE_00 only): liveness, readiness, version, an access-gate stub that
    DENIES BY DEFAULT, and (0.4.0, step 00.6) the read-only integration framework: per-source freshness and
    the conflict queue (resolution records a human decision only, never a business write;
    docs/integration/README.md). Every integration endpoint requires an authenticated principal AND an
    explicit action permission; in PHASE_00 production there is no login and the policy denies everything. Authentication (login/session/MFA) is PHASE_01 (users created only inside the
    system by the owner/admin, DEC-003; no AD/LDAP/SSO). Business resources (customers, products, serials,
    stock, ...) are intentionally absent.

    Cross-cutting conventions (normative for all later phases, see `x-aleekhan-conventions`):
    * Request correlation: client MAY send `X-Request-ID` (UUID); server always echoes/assigns it in the
      response header and in every error body (`request_id`) and audit/outbox record.
    * Errors: `application/problem+json` (RFC 9457) extended with a stable machine `code`, Persian
      `message_fa`, `request_id` and optional field `errors[]`. Codes are stable; texts are not.
    * Pagination: cursor based (`cursor`, `page_size`, default 25, max 100) with `next_cursor`;
      no unbounded lists.
    * Concurrency: resources expose `ETag` (strong, derived from row version); writes require `If-Match`
      (428 if absent, 412 on mismatch).
    * Idempotency: every mutating request (POST/PUT/PATCH/DELETE) requires `Idempotency-Key` (UUID); same
      key + same body => same stored response; same key + different body => 422 IDEMPOTENCY_KEY_REUSED; same key while the first request is still
      running => 409 IDEMPOTENCY_IN_PROGRESS (step 00.3, docs/engine/ERROR_CODES.md).
    * Object-level authorization: a record outside the caller's scope returns 404 NOT_FOUND (not 403) to
      avoid enumeration (BOLA/IDOR, SEC-01).
    * Identifiers: internal ids are UUIDs. 14-digit Rahkaran codes are strings `^[0-9]{14}$` (never numbers;
      leading zeros preserved) and always carried with their namespace (product_code vs die_code).
    * Time: all timestamps RFC 3339 in UTC (`Z`). Jalali display (Asia/Tehran) is a UI concern only.
    * Unknown / unapproved business rules return 409 `RULE_NOT_APPROVED` with the blocking `decision_id`.
  contact:
    name: Aleekhan project (internal)
  license:
    name: Proprietary - internal use only
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Same-origin, versioned base path (staging/production behind HTTPS reverse proxy, DEC-002/DEC-042)
security:
  - sessionCookie: []
tags:
  - name: platform
    description: Health, readiness and version. No business data.
  - name: access
    description: Access-gate stub. Deny-by-default until PHASE_01 implements auth/RBAC.
  - name: integration
    description: |
      Read-only source integration framework (00.6): source freshness and conflict queue. Sources are
      READ_ONLY (Rahkaran = Excel import only, ADR-001). Deny by default (explicit permission per action).
  - name: auth
    description: 'PHASE_01: local login/MFA/session/logout. No AD/LDAP/SSO (DEC-003).'
  - name: me
    description: 'PHASE_01: the caller''s own profile and effective permissions.'
  - name: admin-identity
    description: 'PHASE_01: users, roles, permission catalogue, role assignments (owner/admin only, DEC-003; admin
      != business approval).'
  - name: org
    description: 'PHASE_01: organisation tree - units, positions, holders, reports-to (DEC-043; details DEC-048 APPROVED).'
  - name: workflow
    description: 'PHASE_01: tasks, approvals (maker-checker DEC-032 APPROVED), workflow definitions/instances.'
  - name: audit
    description: 'PHASE_01: read-only audit query and integrity status.'
  - name: jobs
    description: 'PHASE_01: detailed health, job runs, safe cancel (page 36).'
  - name: documents
    description: 'PHASE_01: document registry, revisions, quarantined upload (SEC-03), download of CLEAN files only.'
  - name: parameters
    description: 'PHASE_01: typed versioned parameters, dynamic field drafts (page 42; layout publishing PHASE_11).'
  - name: identity
    description: 'PHASE_02 (PLANNED): customers, products, styles, product codes, code rules, serials, external references (Identity
      module).'
  - name: commercial
    description: 'PHASE_02 (PLANNED): customer orders, lines, versions and change requests (Commercial module).'
paths:
  /health/live:
    get:
      tags: [platform]
      operationId: getLiveness
      summary: Liveness probe (process up)
      description: Unauthenticated. Returns no version, host or dependency details.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
              example:
                status: ok
        '429':
          $ref: '#/components/responses/RateLimited'
  /health/ready:
    get:
      tags: [platform]
      operationId: getReadiness
      summary: Readiness probe (dependencies reachable, migrations applied)
      description: |
        Unauthenticated, intended for the reverse proxy / orchestrator on the private network.
        Exposes only component names and up/down - never hostnames, versions, DSNs or error text.
        Detailed health (jobs, queues) is page 36 / PHASE_01+ and requires authorization.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: All required components ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: ready
                checked_at: '2026-11-03T10:00:00Z'
                components:
                  - {name: database, status: up}
                  - {name: migrations, status: up}
                  - {name: cache, status: up}
        '503':
          description: At least one required component is not ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: not_ready
                checked_at: '2026-11-03T10:00:00Z'
                components:
                  - {name: database, status: down}
                  - {name: migrations, status: unknown}
                  - {name: cache, status: up}
        '429':
          $ref: '#/components/responses/RateLimited'
  /version:
    get:
      tags: [platform]
      operationId: getVersion
      summary: API and build version
      description: |
        Returns API contract version and build identity so reports/screenshots can be tied to a commit.
        C-17 (00.4 decision, to be re-checked in the 00.7 threat model): public, because reports and
        screenshots must be tied to a commit; it returns only the API/contract version, the short build
        commit and the environment name - never Python/Django/PostgreSQL/OS versions, hostnames or paths.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Version information
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
              example:
                api_version: v1
                contract_version: 0.2.0-draft
                build_commit: 0000000
                environment: staging
        '429':
          $ref: '#/components/responses/RateLimited'
  /access-gate/check:
    get:
      tags: [access]
      operationId: checkAccess
      summary: Access-gate stub - deny by default
      description: |
        Stub of the central authorization gate (per action / record scope / field). In PHASE_00 there is
        no login and no permission policy, therefore:
        * no authenticated principal -> 401 AUTHENTICATION_REQUIRED;
        * any principal (test harness only) -> 200 with decision DENY and reason POLICY_NOT_DEFINED
          (parameters are validated first: 400 VALIDATION_FAILED).
        The endpoint is read-only and NEVER grants access; it exists so 00.3/00.4 can test the
        deny-by-default contract. Real policy (roles, scopes, MFA step-up, maker-checker) is PHASE_01
        (permission matrix APPROVED v1.0 by DEC-049, DEC-032 APPROVED, 2026-11-04; implemented in 01.3/01.4).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: action
          in: query
          required: true
          description: Dotted action identifier, e.g. `warehouse.reservation.create`.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){1,4}$'
            maxLength: 120
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]{0,63}$'
        - name: resource_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Decision (always DENY in PHASE_00)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDecision'
              example:
                decision: DENY
                reason_code: POLICY_NOT_DEFINED
                action: warehouse.reservation.create
                request_id: 3f1c2a9e-6b1d-4c8e-9a51-0d2f6f0b7c11
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /integration/freshness:
    get:
      tags: [integration]
      operationId: listIntegrationFreshness
      summary: Freshness of every source in the caller's scope (fresh / stale / never)
      description: |
        Requires permission `platform.integration.freshness.read` (deny by default; record scope = source).
        `freshness` compares `last_success_at` (last batch VALIDATED with at least one valid row) with the
        source's `staleness_threshold_seconds`. `threshold_basis: TECHNICAL_DEFAULT` means the threshold is a
        technical default awaiting the owner decision `policy_decision_id` (DEC-016 for Rahkaran): the UI must
        not present stale or unconfirmed data as real time. `last_as_of` is the snapshot time claimed by the
        importer (unverified evidence). Ordered by `source_code`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of source freshness
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreshnessPage'
              example:
                items:
                  - source_code: rahkaran_excel
                    name_fa: راهکاران — خروجی اکسل (فقط‌خواندنی)
                    kind: EXCEL_FILE
                    direction: READ_ONLY
                    is_enabled: true
                    freshness: never
                    last_success_at: null
                    last_as_of: null
                    staleness_threshold_seconds: 86400
                    threshold_basis: TECHNICAL_DEFAULT
                    policy_decision_id: DEC-016
                page: {page_size: 25, next_cursor: null}
                checked_at: '2026-11-04T08:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '429':
          $ref: '#/components/responses/RateLimited'
  /integration/conflicts:
    get:
      tags: [integration]
      operationId: listIntegrationConflicts
      summary: Conflict queue (items needing a human decision)
      description: |
        Requires permission `platform.integration.conflict.read`; only items of sources in the caller's scope
        are listed. Ordered by creation (internal sequence). `details` are redacted and carry identifiers only.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ConflictStatus'
        - name: source_code
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SourceCode'
      responses:
        '200':
          description: One page of conflict items
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '429':
          $ref: '#/components/responses/RateLimited'
  /integration/conflicts/{conflict_id}:
    parameters:
      - $ref: '#/components/parameters/ConflictId'
    get:
      tags: [integration]
      operationId: getIntegrationConflict
      summary: One conflict item (ETag = row version)
      description: Requires `platform.integration.conflict.read`. Outside the caller's scope -> 404 (BOLA/IDOR).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The conflict item
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictItem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /integration/conflicts/{conflict_id}/resolve:
    parameters:
      - $ref: '#/components/parameters/ConflictId'
    post:
      tags: [integration]
      operationId: resolveIntegrationConflict
      summary: Close an OPEN conflict as RESOLVED or DISMISSED (records the human decision only)
      description: |
        Requires permission `platform.integration.conflict.resolve` and an identified user. Writes the item,
        an audit record and the outbox event `platform.integration.conflict_resolved` in one transaction.
        It NEVER applies any business change (the owning module does that in its own phase, after its rules
        are approved). Not OPEN -> 409 STATE_TRANSITION_NOT_ALLOWED.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConflictResolveRequest'
      responses:
        '200':
          description: Closed conflict item (also returned on an idempotent replay with `Idempotent-Replayed`)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    get:
      tags:
      - auth
      operationId: getLoginContext
      summary: Pre-login context (sets the CSRF cookie only)
      description: |
        Planned PUBLIC operation (CONFLICTS C-26). Sets the `csrftoken` cookie the SPA needs before POSTing credentials; returns no user, policy or version detail.
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginContext'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags:
      - auth
      operationId: login
