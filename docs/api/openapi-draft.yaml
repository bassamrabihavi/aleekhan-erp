x-aleekhan-conventions:
  status: DRAFT
  error_codes:
    VALIDATION_FAILED: 400
    AUTHENTICATION_REQUIRED: 401
    MFA_REQUIRED: 401
    ACCESS_DENIED: 403
    NOT_FOUND: 404
    METHOD_NOT_ALLOWED: 405
    VERSION_CONFLICT: 412
    PAYLOAD_TOO_LARGE: 413
    IDEMPOTENCY_KEY_REUSED: 422
    PRECONDITION_REQUIRED: 428
    IDEMPOTENCY_KEY_REQUIRED: 428
    IDEMPOTENCY_IN_PROGRESS: 409
    RULE_NOT_APPROVED: 409
    STATE_TRANSITION_NOT_ALLOWED: 409
    SOURCE_READ_ONLY: 409
    SOURCE_DISABLED: 409
    INVALID_CREDENTIALS: 401
    NETWORK_POLICY_DENIED: 403
    PASSWORD_CHANGE_REQUIRED: 403
    SELF_APPROVAL_FORBIDDEN: 403
    PASSWORD_POLICY_VIOLATION: 422
    FILE_TYPE_NOT_ALLOWED: 415
    FILE_NOT_RELEASED: 409
    JOB_PROTECTED: 409
    RATE_LIMITED: 429
    INTERNAL_ERROR: 500
    DEPENDENCY_UNAVAILABLE: 503
  write_requirements: [authenticated, role+record scope, Idempotency-Key, If-Match for updates, audit record, outbox event in same transaction]
  resource_naming: plural kebab-case nouns grouped by owning module (e.g. /warehouse/reservations); state changes as sub-resource actions POST /{resource}/{id}/{action} (see docs/discovery/CONFLICTS.md C-09)
  out_of_scope_phase_00: [customers, products, styles, serials, orders, engineering, warehouse, production, quality, dispatch, hr, ai]
  planned_operations_rule: |
    Path items with `x-aleekhan-status: planned` are contract drafts for the step named in `x-aleekhan-step`.
    They must not be routed until that step implements them (route parity covers implemented paths only); when
    implemented, the marker is removed in the same reviewed commit. Planned operations never weaken the
    conventions above: auth + permission (`x-aleekhan-permission`), Idempotency-Key on mutations (except
    `idempotency_exempt`), If-Match on updates, audit + outbox in the same transaction.
  planned_public_operations: [getLoginContext, login]
  idempotency_exempt:
    operations: [login, verifyMfa, stepUpMfa, logout, changeMyPassword, startMfaEnrolment, confirmMfaEnrolment]
    reason: |
      Authentication ceremonies are not replayable business writes: their responses create/rotate session state
      or reveal one-time secrets that must never be stored in an idempotency record, and their bodies carry
      credentials whose hash must not be persisted. Duplicate submission is harmless (a second login simply
      rotates the session again). Protection instead: CSRF, rate limits, lockout (DEC-051), audit of every attempt.
      (CONFLICTS C-27.)
  planned_error_codes: {}
  planned_error_codes_note: |
    Codes proposed by a step but not yet in `ErrorCode` (the engine catalogue, golden file and this enum change
    together in one reviewed commit, docs/engine/ERROR_CODES.md rule 5). Empty since 0.5.2-draft: the PHASE_01
    codes were implemented by the 01.3 domain engine.
  mfa_step_up_rule: |
    Operations with `x-aleekhan-mfa-step-up: true` require an MFA verification younger than the step-up window
    (DEC-051: 15 minutes) for every caller, inside or outside the factory network (DEC-049); this is in addition to the login-time MFA
    rules (DEC-003 role list, DEC-042 outside logins).
  out_of_scope_phase_01: [customers, products, styles, serials, orders, engineering, warehouse, production, quality, dispatch, hr, ai, force-kill (DEC-024), layout publishing (PHASE_11), break-glass account use (DEC-054: console command only, no API)]
