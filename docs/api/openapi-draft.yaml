openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Aleekhan Factory Platform API
  version: 0.4.0-draft
  summary: PHASE_00 draft contract (steps 00.1-00.6). Platform endpoints only, NO business writes.
  description: |
    Status: DRAFT (PHASE_00 / 00.1 Discovery & Contract, implemented in 00.4). Not approved. This hand-written
    document is the contract (contract-first): the backend is tested against it (route parity, security
    declarations and response-schema validation of every phase-0 endpoint in
    backend/platform_core/tests/test_api_contract.py). Runtime details: docs/api/API_RUNTIME.md.

    Stack: Django 5.2 LTS + DRF (DEC-001). Base path is versioned: every endpoint lives under `/api/v1`.
    A breaking change requires `/api/v2` (or an explicitly approved deprecation window); additive changes only
    within v1. Security is declared top-level (`sessionCookie`, deny by default); only the platform probes
    override it with `security: []` (REV-0001).

    Scope of this draft (PHASE_00 only): liveness, readiness, version, an access-gate stub that
    DENIES BY DEFAULT, and (0.4.0, step 00.6) the read-only integration framework: per-source freshness and
    the conflict queue (resolution records a human decision only, never a business write;
    docs/integration/README.md). Every integration endpoint requires an authenticated principal AND an
    explicit action permission; in PHASE_00 production there is no login and the policy denies everything. Authentication (login/session/MFA) is PHASE_01 (users created only inside the
    system by the owner/admin, DEC-003; no AD/LDAP/SSO). Business resources (customers, products, serials,
    stock, ...) are intentionally absent.

    Cross-cutting conventions (normative for all later phases, see `x-aleekhan-conventions`):
    * Request correlation: client MAY send `X-Request-ID` (UUID); server always echoes/assigns it in the
      response header and in every error body (`request_id`) and audit/outbox record.
    * Errors: `application/problem+json` (RFC 9457) extended with a stable machine `code`, Persian
      `message_fa`, `request_id` and optional field `errors[]`. Codes are stable; texts are not.
    * Pagination: cursor based (`cursor`, `page_size`, default 25, max 100) with `next_cursor`;
      no unbounded lists.
    * Concurrency: resources expose `ETag` (strong, derived from row version); writes require `If-Match`
      (428 if absent, 412 on mismatch).
    * Idempotency: every mutating request (POST/PUT/PATCH/DELETE) requires `Idempotency-Key` (UUID); same
      key + same body => same stored response; same key + different body => 422 IDEMPOTENCY_KEY_REUSED; same key while the first request is still
      running => 409 IDEMPOTENCY_IN_PROGRESS (step 00.3, docs/engine/ERROR_CODES.md).
    * Object-level authorization: a record outside the caller's scope returns 404 NOT_FOUND (not 403) to
      avoid enumeration (BOLA/IDOR, SEC-01).
    * Identifiers: internal ids are UUIDs. 14-digit Rahkaran codes are strings `^[0-9]{14}$` (never numbers;
      leading zeros preserved) and always carried with their namespace (product_code vs die_code).
    * Time: all timestamps RFC 3339 in UTC (`Z`). Jalali display (Asia/Tehran) is a UI concern only.
    * Unknown / unapproved business rules return 409 `RULE_NOT_APPROVED` with the blocking `decision_id`.
  contact:
    name: Aleekhan project (internal)
  license:
    name: Proprietary - internal use only
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Same-origin, versioned base path (staging/production behind HTTPS reverse proxy, DEC-002/DEC-042)
security:
  - sessionCookie: []
tags:
  - name: platform
    description: Health, readiness and version. No business data.
  - name: access
    description: Access-gate stub. Deny-by-default until PHASE_01 implements auth/RBAC.
  - name: integration
    description: |
      Read-only source integration framework (00.6): source freshness and conflict queue. Sources are
      READ_ONLY (Rahkaran = Excel import only, ADR-001). Deny by default (explicit permission per action).
paths:
  /health/live:
    get:
      tags: [platform]
      operationId: getLiveness
      summary: Liveness probe (process up)
      description: Unauthenticated. Returns no version, host or dependency details.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
              example:
                status: ok
        '429':
          $ref: '#/components/responses/RateLimited'
  /health/ready:
    get:
      tags: [platform]
      operationId: getReadiness
      summary: Readiness probe (dependencies reachable, migrations applied)
      description: |
        Unauthenticated, intended for the reverse proxy / orchestrator on the private network.
        Exposes only component names and up/down - never hostnames, versions, DSNs or error text.
        Detailed health (jobs, queues) is page 36 / PHASE_01+ and requires authorization.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: All required components ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: ready
                checked_at: '2026-11-03T10:00:00Z'
                components:
                  - {name: database, status: up}
                  - {name: migrations, status: up}
                  - {name: cache, status: up}
        '503':
          description: At least one required component is not ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: not_ready
                checked_at: '2026-11-03T10:00:00Z'
                components:
                  - {name: database, status: down}
                  - {name: migrations, status: unknown}
                  - {name: cache, status: up}
        '429':
          $ref: '#/components/responses/RateLimited'
  /version:
    get:
      tags: [platform]
      operationId: getVersion
      summary: API and build version
      description: |
        Returns API contract version and build identity so reports/screenshots can be tied to a commit.
        C-17 (00.4 decision, to be re-checked in the 00.7 threat model): public, because reports and
        screenshots must be tied to a commit; it returns only the API/contract version, the short build
        commit and the environment name - never Python/Django/PostgreSQL/OS versions, hostnames or paths.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Version information
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
              example:
                api_version: v1
                contract_version: 0.2.0-draft
                build_commit: 0000000
                environment: staging
        '429':
          $ref: '#/components/responses/RateLimited'
  /access-gate/check:
    get:
      tags: [access]
      operationId: checkAccess
      summary: Access-gate stub - deny by default
      description: |
        Stub of the central authorization gate (per action / record scope / field). In PHASE_00 there is
        no login and no permission policy, therefore:
        * no authenticated principal -> 401 AUTHENTICATION_REQUIRED;
        * any principal (test harness only) -> 200 with decision DENY and reason POLICY_NOT_DEFINED
          (parameters are validated first: 400 VALIDATION_FAILED).
        The endpoint is read-only and NEVER grants access; it exists so 00.3/00.4 can test the
        deny-by-default contract. Real policy (roles, scopes, MFA step-up, maker-checker) is PHASE_01
        (permission matrix still PROPOSED; DEC-032 PROPOSED).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: action
          in: query
          required: true
          description: Dotted action identifier, e.g. `warehouse.reservation.create`.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){1,4}$'
            maxLength: 120
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]{0,63}$'
        - name: resource_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Decision (always DENY in PHASE_00)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDecision'
              example:
                decision: DENY
                reason_code: POLICY_NOT_DEFINED
                action: warehouse.reservation.create
                request_id: 3f1c2a9e-6b1d-4c8e-9a51-0d2f6f0b7c11
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /integration/freshness:
    get:
      tags: [integration]
      operationId: listIntegrationFreshness
      summary: Freshness of every source in the caller's scope (fresh / stale / never)
      description: |
        Requires permission `platform.integration.freshness.read` (deny by default; record scope = source).
        `freshness` compares `last_success_at` (last batch VALIDATED with at least one valid row) with the
        source's `staleness_threshold_seconds`. `threshold_basis: TECHNICAL_DEFAULT` means the threshold is a
        technical default awaiting the owner decision `policy_decision_id` (DEC-016 for Rahkaran): the UI must
        not present stale or unconfirmed data as real time. `last_as_of` is the snapshot time claimed by the
        importer (unverified evidence). Ordered by `source_code`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of source freshness
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreshnessPage'
              example:
                items:
                  - source_code: rahkaran_excel
                    name_fa: راهکاران — خروجی اکسل (فقط‌خواندنی)
                    kind: EXCEL_FILE
                    direction: READ_ONLY
                    is_enabled: true
                    freshness: never
                    last_success_at: null
                    last_as_of: null
                    staleness_threshold_seconds: 86400
                    threshold_basis: TECHNICAL_DEFAULT
                    policy_decision_id: DEC-016
                page: {page_size: 25, next_cursor: null}
                checked_at: '2026-11-04T08:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '429':
          $ref: '#/components/responses/RateLimited'
  /integration/conflicts:
    get:
      tags: [integration]
      operationId: listIntegrationConflicts
      summary: Conflict queue (items needing a human decision)
      description: |
        Requires permission `platform.integration.conflict.read`; only items of sources in the caller's scope
        are listed. Ordered by creation (internal sequence). `details` are redacted and carry identifiers only.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ConflictStatus'
        - name: source_code
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SourceCode'
      responses:
        '200':
          description: One page of conflict items
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '429':
          $ref: '#/components/responses/RateLimited'
  /integration/conflicts/{conflict_id}:
    parameters:
      - $ref: '#/components/parameters/ConflictId'
    get:
      tags: [integration]
      operationId: getIntegrationConflict
      summary: One conflict item (ETag = row version)
      description: Requires `platform.integration.conflict.read`. Outside the caller's scope -> 404 (BOLA/IDOR).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The conflict item
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictItem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /integration/conflicts/{conflict_id}/resolve:
    parameters:
      - $ref: '#/components/parameters/ConflictId'
    post:
      tags: [integration]
      operationId: resolveIntegrationConflict
      summary: Close an OPEN conflict as RESOLVED or DISMISSED (records the human decision only)
      description: |
        Requires permission `platform.integration.conflict.resolve` and an identified user. Writes the item,
        an audit record and the outbox event `platform.integration.conflict_resolved` in one transaction.
        It NEVER applies any business change (the owning module does that in its own phase, after its rules
        are approved). Not OPEN -> 409 STATE_TRANSITION_NOT_ALLOWED.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConflictResolveRequest'
      responses:
        '200':
          description: Closed conflict item (also returned on an idempotent replay with `Idempotent-Replayed`)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: aleekhan_session
      description: |
        PLANNED for PHASE_01: server-side Django session (HttpOnly, Secure, SameSite=Lax) issued after
        local username/password (+ MFA per DEC-003/DEC-042). Unsafe methods additionally require the
        `X-CSRFToken` header. No AD/LDAP/SSO (DEC-003). Not usable in PHASE_00.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Client correlation id; server generates one when absent or malformed.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on every mutating request (none exist in PHASE_00). Stored with request hash and response.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the version being modified (optimistic concurrency). Missing -> 428, stale -> 412.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `next_cursor`.
      schema:
        type: string
        maxLength: 512
    ConflictId:
      name: conflict_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  headers:
    X-Request-ID:
      description: Correlation id of this request (echoed or generated).
      schema:
        type: string
        format: uuid
    ETag:
      description: Strong entity tag of the returned representation/version.
      schema:
        type: string
    Retry-After:
      description: Seconds before retrying.
      schema:
        type: integer
        minimum: 1
    Cache-Control:
      description: Cache directive (`no-cache` = revalidate with the ETag).
      schema:
        type: string
        enum: [no-cache, no-store]
    Idempotent-Replayed:
      description: '`true` when the response is the stored response of an earlier request with the same key.'
      schema:
        type: string
        const: 'true'
    Cache-Control-NoStore:
      description: Always `no-store` for health/access responses.
      schema:
        type: string
        const: no-store
  responses:
    ValidationFailed:
      description: Request parameters invalid
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.aleekhan.invalid/VALIDATION_FAILED
            title: Validation failed
            status: 400
            code: VALIDATION_FAILED
            message_fa: مقدار ورودی معتبر نیست.
            request_id: 3f1c2a9e-6b1d-4c8e-9a51-0d2f6f0b7c11
            errors:
              - field: action
                code: PATTERN_MISMATCH
    AuthenticationRequired:
      description: No authenticated principal
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.aleekhan.invalid/AUTHENTICATION_REQUIRED
            title: Authentication required
            status: 401
            code: AUTHENTICATION_REQUIRED
            message_fa: برای این کار باید وارد سامانه شوید.
            request_id: 3f1c2a9e-6b1d-4c8e-9a51-0d2f6f0b7c11
    AccessDenied:
      description: Authenticated but the action is not permitted
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Missing, or outside the caller's scope (BOLA/IDOR)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: STATE_TRANSITION_NOT_ALLOWED, RULE_NOT_APPROVED, IDEMPOTENCY_IN_PROGRESS, SOURCE_READ_ONLY or SOURCE_DISABLED
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    VersionConflict:
      description: If-Match is stale or weak
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match or Idempotency-Key missing
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyKeyReused:
      description: Same Idempotency-Key used for a different request
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Too many requests
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ComponentStatus:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          enum: [database, migrations, cache, object_storage, worker]
        status:
          type: string
          enum: [up, down, unknown]
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checked_at, components]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checked_at:
          $ref: '#/components/schemas/UtcTimestamp'
        components:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/ComponentStatus'
    VersionInfo:
      type: object
      additionalProperties: false
      required: [api_version, contract_version, build_commit, environment]
      properties:
        api_version:
          type: string
          const: v1
        contract_version:
          type: string
          description: SemVer of the OpenAPI document.
        build_commit:
          type: string
          pattern: '^[0-9a-f]{7,40}$'
        environment:
          type: string
          enum: [dev, test, staging, production]
    AccessDecision:
      type: object
      additionalProperties: false
      required: [decision, reason_code, action, request_id]
      properties:
        decision:
          type: string
          enum: [ALLOW, DENY]
          description: Always DENY in PHASE_00.
        reason_code:
          type: string
          enum: [POLICY_NOT_DEFINED, ROLE_MISSING, SCOPE_MISMATCH, MFA_STEP_UP_REQUIRED, SELF_APPROVAL_FORBIDDEN, RULE_NOT_APPROVED]
        action:
          type: string
        decision_id:
          type: [string, 'null']
          pattern: '^DEC-[0-9]{3}$'
          description: Blocking decision when reason_code is RULE_NOT_APPROVED.
        request_id:
          type: string
          format: uuid
    Problem:
      type: object
      description: RFC 9457 problem details + Aleekhan stable fields. Never contains stack traces, SQL, secrets or PII.
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ErrorCode'
        message_fa:
          type: string
          description: Human Persian message (may change; clients must branch on `code`).
        detail:
          type: string
        request_id:
          type: string
          format: uuid
        decision_id:
          type: string
          pattern: '^DEC-[0-9]{3}$'
          description: Present with RULE_NOT_APPROVED.
        errors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string
              message_fa:
                type: string
    ErrorCode:
      type: string
      description: Stable machine error codes (HTTP mapping in x-aleekhan-conventions.error_codes).
      enum:
        - VALIDATION_FAILED
        - AUTHENTICATION_REQUIRED
        - MFA_REQUIRED
        - ACCESS_DENIED
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - PRECONDITION_REQUIRED
        - VERSION_CONFLICT
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - RULE_NOT_APPROVED
        - STATE_TRANSITION_NOT_ALLOWED
        - SOURCE_READ_ONLY
        - SOURCE_DISABLED
        - RATE_LIMITED
        - PAYLOAD_TOO_LARGE
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
    UtcTimestamp:
      type: string
      format: date-time
      pattern: 'Z$'
      description: RFC 3339 UTC timestamp.
    Code14:
      type: string
      pattern: '^[0-9]{14}$'
      minLength: 14
      maxLength: 14
      description: 14-digit Rahkaran code as STRING (leading zeros preserved). Must be paired with a namespace.
    CodeNamespace:
      type: string
      enum: [product_code, die_code]
      description: Namespaces are independent; no shared sequence (DOMAIN_ENTITY_CATALOG.md). Cliche codes are alphanumeric and NOT Code14.
    SourceCode:
      type: string
      pattern: '^[a-z][a-z0-9_]{2,63}$'
    SourceFreshness:
      type: object
      additionalProperties: false
      required: [source_code, name_fa, kind, direction, is_enabled, freshness, last_success_at, last_as_of,
                 staleness_threshold_seconds, threshold_basis, policy_decision_id]
      properties:
        source_code:
          $ref: '#/components/schemas/SourceCode'
        name_fa:
          type: string
        kind:
          type: string
          enum: [EXCEL_FILE, XLSM_FILE]
        direction:
          type: string
          const: READ_ONLY
          description: Every PHASE_00 source is read-only (DB CHECK); write-back needs its own ADR.
        is_enabled:
          type: boolean
        freshness:
          type: string
          enum: [fresh, stale, never]
        last_success_at:
          oneOf:
            - $ref: '#/components/schemas/UtcTimestamp'
            - type: 'null'
        last_as_of:
          oneOf:
            - $ref: '#/components/schemas/UtcTimestamp'
            - type: 'null'
        staleness_threshold_seconds:
          type: integer
          minimum: 1
        threshold_basis:
          type: string
          enum: [TECHNICAL_DEFAULT, OWNER_APPROVED]
        policy_decision_id:
          type: string
          pattern: '^DEC-[0-9]{3}$'
    FreshnessPage:
      type: object
      additionalProperties: false
      required: [items, page, checked_at]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SourceFreshness'
        page:
          $ref: '#/components/schemas/PageMeta'
        checked_at:
          $ref: '#/components/schemas/UtcTimestamp'
    ConflictStatus:
      type: string
      enum: [OPEN, RESOLVED, DISMISSED]
    ConflictItem:
      type: object
      additionalProperties: false
      required: [conflict_id, source_code, batch_id, kind, conflict_key, details, status, raised_at, resolved_at,
                 resolution_note, row_version]
      properties:
        conflict_id:
          type: string
          format: uuid
        source_code:
          $ref: '#/components/schemas/SourceCode'
        batch_id:
          type: [string, 'null']
          format: uuid
        kind:
          type: string
          pattern: '^[a-z][a-z0-9_]{2,63}$'
        conflict_key:
          type: string
          minLength: 1
          maxLength: 200
        details:
          type: object
          description: Redacted; identifiers only (no personal data, secrets or salary).
        status:
          $ref: '#/components/schemas/ConflictStatus'
        raised_at:
          $ref: '#/components/schemas/UtcTimestamp'
        resolved_at:
          oneOf:
            - $ref: '#/components/schemas/UtcTimestamp'
            - type: 'null'
        resolution_note:
          type: [string, 'null']
          maxLength: 500
        row_version:
          type: integer
          minimum: 1
    ConflictPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ConflictItem'
        page:
          $ref: '#/components/schemas/PageMeta'
    ConflictResolveRequest:
      type: object
      additionalProperties: false
      required: [outcome, note]
      properties:
        outcome:
          type: string
          enum: [RESOLVED, DISMISSED]
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: Short justification without personal data (stored with the item and in the audit trail).
    PageMeta:
      type: object
      additionalProperties: false
      required: [page_size, next_cursor]
      properties:
        page_size:
          type: integer
        next_cursor:
          type: [string, 'null']
x-aleekhan-conventions:
  status: DRAFT
  error_codes:
    VALIDATION_FAILED: 400
    AUTHENTICATION_REQUIRED: 401
    MFA_REQUIRED: 401
    ACCESS_DENIED: 403
    NOT_FOUND: 404
    METHOD_NOT_ALLOWED: 405
    VERSION_CONFLICT: 412
    PAYLOAD_TOO_LARGE: 413
    IDEMPOTENCY_KEY_REUSED: 422
    PRECONDITION_REQUIRED: 428
    IDEMPOTENCY_KEY_REQUIRED: 428
    IDEMPOTENCY_IN_PROGRESS: 409
    RULE_NOT_APPROVED: 409
    STATE_TRANSITION_NOT_ALLOWED: 409
    SOURCE_READ_ONLY: 409
    SOURCE_DISABLED: 409
    RATE_LIMITED: 429
    INTERNAL_ERROR: 500
    DEPENDENCY_UNAVAILABLE: 503
  write_requirements: [authenticated, role+record scope, Idempotency-Key, If-Match for updates, audit record, outbox event in same transaction]
  resource_naming: plural kebab-case nouns grouped by owning module (e.g. /warehouse/reservations); state changes as sub-resource actions POST /{resource}/{id}/{action} (see docs/discovery/CONFLICTS.md C-09)
  out_of_scope_phase_00: [customers, products, styles, serials, orders, engineering, warehouse, production, quality, dispatch, hr, ai]
