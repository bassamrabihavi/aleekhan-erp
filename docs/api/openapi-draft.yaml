components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: aleekhan_session
      description: |
        PHASE_01 (implemented in 01.4): server-side session (HttpOnly, Secure outside dev/test, SameSite=Lax) issued after
        local username/password (+ MFA per DEC-003/DEC-042). Unsafe methods additionally require the
        `X-CSRFToken` header (cookie `csrftoken` from getLoginContext). No AD/LDAP/SSO (DEC-003).
        0.5.0 (01.1): the session id is rotated at login and at MFA verification; a session in state
        MFA_PENDING is accepted only by `verifyMfa` and `logout`. Idle/absolute timeout (DEC-051): users 2 h / 12 h, operators idle 8 h internal only; max 3 concurrent sessions. Browser
        only (DEC-002): no bearer/API tokens in PHASE_01 (CONFLICTS C-35).
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Client correlation id; server generates one when absent or malformed.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on every mutating request (none exist in PHASE_00). Stored with request hash and response.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the version being modified (optimistic concurrency). Missing -> 428, stale -> 412.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
