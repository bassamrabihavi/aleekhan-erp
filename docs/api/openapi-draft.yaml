          maxItems: 16
          items:
            type: string
          description: Shown once; 10 one-time codes, stored as hashes only (DEC-050).
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
      - current_password
      - new_password
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        new_password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
    OneTimeCredential:
      type: object
      additionalProperties: false
      required:
      - user_id
      - one_time_password
      - expires_at
      properties:
        user_id:
          type: string
          format: uuid
        one_time_password:
          type: string
          description: Shown once to the admin; valid 72 h; must be changed at first login; never logged or stored in clear (DEC-051). Server-generated (policy-compliant random). An idempotent replay answers `[REDACTED]` (the secret is never stored in the idempotency record).
