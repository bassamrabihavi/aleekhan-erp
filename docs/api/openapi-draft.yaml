      required:
      - checked_at
      - components
      - outbox
      - jobs
      properties:
        checked_at:
          $ref: '#/components/schemas/UtcTimestamp'
        components:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/ComponentStatus'
        outbox:
          type: object
